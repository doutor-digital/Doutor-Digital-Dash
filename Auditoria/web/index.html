<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auditoria de Prontuários · Doutor Hérnia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>Auditoria de Prontuários</h1>
        <div class="meta" id="meta">carregando…</div>
      </div>
      <div class="spacer"></div>
      <button class="tema" id="tema" type="button">Tema</button>
    </header>

    <section class="tiles" id="tiles"></section>

    <section class="painel">
      <h2>Achados por regra</h2>
      <div class="sub">Quantas fichas dispararam cada regra. Severidade indicada por cor, glifo e rótulo.</div>
      <div id="grafico-regras"></div>
    </section>

    <div class="filtros">
      <input type="search" id="busca" placeholder="Buscar paciente, fisioterapeuta ou nº do atendimento" aria-label="Buscar">
      <select id="f-severidade" aria-label="Filtrar por severidade">
        <option value="">Todas as severidades</option>
        <option value="critico">Somente com crítico</option>
        <option value="alerta">Somente com alerta</option>
        <option value="limpo">Sem achados</option>
      </select>
      <select id="f-profissional" aria-label="Filtrar por fisioterapeuta">
        <option value="">Todos os fisioterapeutas</option>
      </select>
      <select id="f-regra" aria-label="Filtrar por regra">
        <option value="">Todas as regras</option>
      </select>
      <span class="contagem" id="contagem"></span>
    </div>

    <div class="split">
      <div class="lista" id="lista" role="listbox" aria-label="Fichas auditadas"></div>
      <div class="painel detalhe" id="detalhe"></div>
    </div>

    <section class="painel" style="margin-top:20px">
      <h2>Por fisioterapeuta</h2>
      <div class="sub">Achados acumulados por profissional responsável na unidade.</div>
      <table class="tabela" id="tabela-prof"></table>
    </section>
  </div>

  <div class="dica" id="dica" role="tooltip"></div>

  <script src="relatorio.js"></script>
  <script type="module" src="js/web-src/app.js"></script>
</body>
</html>
